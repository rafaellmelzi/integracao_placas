version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autoparts_db
    restart: always
    environment:
      POSTGRES_USER: autoparts_user
      POSTGRES_PASSWORD: autoparts_password
      POSTGRES_DB: autoparts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoparts_user -d autoparts_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: autoparts_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://autoparts_user:autoparts_password@db:5432/autoparts_db
      - PLATE_PROVIDER_PRIMARY=MOCK
      - PLATE_CACHE_TTL_DAYS=90
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seeds.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
